<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Campus | Event Management System</title>
    <!-- React, Babel, and Tailwind CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        .tab-transition { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="bg-[#f8fafc]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- MOCK DATABASE (Equivalent to MySQL Tables) ---
        const INITIAL_EVENTS = [
            { id: 1, title: "Tech Innovate 2024", category: "Technical", date: "2024-05-15", time: "10:00 AM", location: "Auditorium A", capacity: 100, booked: 45, image: "💻", description: "Exploring the next frontier of AI and Robotics." },
            { id: 2, title: "Campus Rock Night", category: "Cultural", date: "2024-05-18", time: "06:00 PM", location: "Open Grounds", capacity: 500, booked: 320, image: "🎸", description: "The biggest musical night featuring local student bands." },
            { id: 3, title: "Inter-College Chess", category: "Sports", date: "2024-05-20", time: "09:00 AM", location: "Student Lounge", capacity: 50, booked: 48, image: "♟️", description: "Strategic battles for the grand championship trophy." },
            { id: 4, title: "Code-A-Thon", category: "Technical", date: "2024-05-22", time: "08:00 AM", location: "Lab 402", capacity: 30, booked: 12, image: "🚀", description: "24-hour hacking challenge to solve real-world campus problems." }
        ];

        // --- COMPONENTS ---
        
        const StatCard = ({ label, value, color }) => (
            <div className={`p-6 rounded-2xl border bg-white shadow-sm border-slate-100`}>
                <p className="text-slate-500 text-sm font-semibold mb-1 uppercase tracking-wider">{label}</p>
                <p className={`text-3xl font-extrabold ${color}`}>{value}</p>
            </div>
        );

        function App() {
            const [view, setView] = useState('home'); // home, registration, admin, my-tickets
            const [selectedEvent, setSelectedEvent] = useState(null);
            const [events, setEvents] = useState(INITIAL_EVENTS);
            const [bookings, setBookings] = useState([]);
            const [filter, setFilter] = useState('All');
            const [search, setSearch] = useState('');

            // --- DATABASE QUERY SIMULATIONS (K3 Requirement) ---
            
            // 1. SELECT * FROM events WHERE category = ? (Filtered Query)
            const filteredEvents = useMemo(() => {
                return events.filter(e => {
                    const matchesFilter = filter === 'All' || e.category === filter;
                    const matchesSearch = e.title.toLowerCase().includes(search.toLowerCase());
                    return matchesFilter && matchesSearch;
                });
            }, [events, filter, search]);

            // 2. INSERT INTO bookings (Registration Logic)
            const handleRegister = (formData) => {
                const newBooking = {
                    id: Date.now(),
                    eventId: selectedEvent.id,
                    eventTitle: selectedEvent.title,
                    ...formData,
                    bookingDate: new Date().toLocaleDateString()
                };

                // UPDATE events SET booked = booked + 1 WHERE id = ?
                const updatedEvents = events.map(e => 
                    e.id === selectedEvent.id ? { ...e, booked: e.booked + 1 } : e
                );

                setEvents(updatedEvents);
                setBookings([newBooking, ...bookings]);
                setView('my-tickets');
            };

            // 3. DELETE FROM bookings WHERE id = ?
            const cancelBooking = (id, eventId) => {
                setBookings(bookings.filter(b => b.id !== id));
                setEvents(events.map(e => e.id === eventId ? { ...e, booked: e.booked - 1 } : e));
            };

            return (
                <div className="min-h-screen pb-20">
                    {/* Navigation */}
                    <nav className="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-200">
                        <div className="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-2 cursor-pointer group" onClick={() => setView('home')}>
                                <div className="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-indigo-200 group-hover:rotate-6 transition-transform">
                                    <span className="font-bold">S</span>
                                </div>
                                <span className="text-xl font-bold tracking-tight text-slate-800">SmartCampus</span>
                            </div>
                            <div className="flex gap-1 bg-slate-100 p-1 rounded-xl">
                                {['home', 'my-tickets', 'admin'].map(tab => (
                                    <button 
                                        key={tab}
                                        onClick={() => setView(tab)}
                                        className={`px-4 py-2 rounded-lg text-sm font-bold capitalize tab-transition ${view === tab ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
                                    >
                                        {tab.replace('-', ' ')}
                                    </button>
                                ))}
                            </div>
                        </div>
                    </nav>

                    <main className="max-w-6xl mx-auto px-6 pt-8">
                        
                        {/* ADMIN DASHBOARD VIEW */}
                        {view === 'admin' && (
                            <div className="animate-fade space-y-8">
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <StatCard label="Total Events" value={events.length} color="text-indigo-600" />
                                    <StatCard label="Total Bookings" value={bookings.length} color="text-emerald-600" />
                                    <StatCard label="Waitlist Items" value={events.filter(e => e.booked >= e.capacity).length} color="text-amber-600" />
                                </div>

                                <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
                                    <div className="p-6 border-b border-slate-50 flex justify-between items-center">
                                        <h2 className="text-lg font-bold">Manage Registrations</h2>
                                        <span className="text-xs font-bold text-slate-400 uppercase tracking-widest">Live Sync Enabled</span>
                                    </div>
                                    <table className="w-full text-left">
                                        <thead className="bg-slate-50/50 text-slate-400 text-[10px] font-bold uppercase tracking-widest">
                                            <tr>
                                                <th className="px-6 py-4">Student</th>
                                                <th className="px-6 py-4">Event</th>
                                                <th className="px-6 py-4">Dept</th>
                                                <th className="px-6 py-4">Status</th>
                                                <th className="px-6 py-4 text-right">Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {bookings.map(b => (
                                                <tr key={b.id} className="hover:bg-slate-50/50 transition-colors">
                                                    <td className="px-6 py-4">
                                                        <div className="font-bold text-slate-700">{b.name}</div>
                                                        <div className="text-xs text-slate-400">{b.email}</div>
                                                    </td>
                                                    <td className="px-6 py-4 text-sm font-semibold text-slate-600">{b.eventTitle}</td>
                                                    <td className="px-6 py-4">
                                                        <span className="bg-indigo-50 text-indigo-600 px-2.5 py-1 rounded-md text-[10px] font-bold uppercase tracking-wide">
                                                            {b.department}
                                                        </span>
                                                    </td>
                                                    <td className="px-6 py-4">
                                                        <div className="flex items-center gap-1.5 text-emerald-500 font-bold text-xs uppercase">
                                                            <div className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></div>
                                                            Confirmed
                                                        </div>
                                                    </td>
                                                    <td className="px-6 py-4 text-right">
                                                        <button onClick={() => cancelBooking(b.id, b.eventId)} className="text-red-300 hover:text-red-500 transition-colors p-2 rounded-lg hover:bg-red-50">
                                                            Cancel
                                                        </button>
                                                    </td>
                                                </tr>
                                            ))}
                                            {bookings.length === 0 && (
                                                <tr><td colSpan="5" className="px-6 py-20 text-center text-slate-300 italic">Database is empty. No student registrations found.</td></tr>
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* MY TICKETS VIEW */}
                        {view === 'my-tickets' && (
                            <div className="animate-fade space-y-6 max-w-2xl mx-auto">
                                <h2 className="text-2xl font-black text-slate-800">My Registrations</h2>
                                {bookings.map(b => (
                                    <div key={b.id} className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex gap-6 relative overflow-hidden group">
                                        <div className="absolute top-0 right-0 w-2 h-full bg-emerald-500"></div>
                                        <div className="w-16 h-16 bg-slate-50 rounded-xl flex items-center justify-center text-3xl shrink-0 group-hover:bg-emerald-50 transition-colors">
                                            🎟️
                                        </div>
                                        <div className="flex-1">
                                            <div className="flex justify-between items-start mb-2">
                                                <h3 className="font-bold text-lg text-slate-800">{b.eventTitle}</h3>
                                                <span className="text-[10px] font-bold text-slate-300 uppercase tracking-widest">ID: #{b.id.toString().slice(-6)}</span>
                                            </div>
                                            <div className="grid grid-cols-2 gap-y-2 mb-4">
                                                <div><p className="text-[10px] text-slate-400 font-bold uppercase">Student</p><p className="text-sm font-semibold">{b.name}</p></div>
                                                <div><p className="text-[10px] text-slate-400 font-bold uppercase">Booked On</p><p className="text-sm font-semibold">{b.bookingDate}</p></div>
                                            </div>
                                            <button 
                                                onClick={() => cancelBooking(b.id, b.eventId)}
                                                className="text-xs font-bold text-red-400 hover:text-red-600 uppercase tracking-widest"
                                            >
                                                Cancel Ticket
                                            </button>
                                        </div>
                                    </div>
                                ))}
                                {bookings.length === 0 && (
                                    <div className="text-center py-20 bg-white rounded-3xl border border-dashed border-slate-200">
                                        <p className="text-slate-400 font-medium">You haven't registered for any events yet.</p>
                                        <button onClick={() => setView('home')} className="mt-4 text-indigo-600 font-bold hover:underline underline-offset-4">Explore Events</button>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* HOME VIEW (EVENT LISTING) */}
                        {view === 'home' && (
                            <div className="animate-fade space-y-8">
                                {/* Header & Filters */}
                                <div className="flex flex-col md:flex-row md:items-end justify-between gap-6">
                                    <div>
                                        <h1 className="text-3xl font-black text-slate-800 mb-2">Campus Events</h1>
                                        <p className="text-slate-500 font-medium">Discover and participate in upcoming campus activities.</p>
                                    </div>
                                    <div className="flex flex-wrap gap-2">
                                        {['All', 'Technical', 'Cultural', 'Sports'].map(cat => (
                                            <button 
                                                key={cat}
                                                onClick={() => setFilter(cat)}
                                                className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${filter === cat ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-100' : 'bg-white text-slate-500 border border-slate-200 hover:border-indigo-200'}`}
                                            >
                                                {cat}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* Event Grid */}
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {filteredEvents.map(event => {
                                        const isSoldOut = event.booked >= event.capacity;
                                        return (
                                            <div key={event.id} className="bg-white rounded-3xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-xl hover:shadow-indigo-50/50 transition-all group flex flex-col">
                                                <div className="h-40 bg-slate-50 flex items-center justify-center text-6xl group-hover:scale-110 transition-transform duration-500">
                                                    {event.image}
                                                </div>
                                                <div className="p-6 flex flex-col flex-1">
                                                    <div className="flex justify-between items-start mb-2">
                                                        <span className="bg-indigo-50 text-indigo-600 text-[10px] font-black uppercase tracking-widest px-2 py-0.5 rounded">
                                                            {event.category}
                                                        </span>
                                                        <span className={`text-[10px] font-bold uppercase tracking-widest ${isSoldOut ? 'text-red-500' : 'text-emerald-500'}`}>
                                                            {isSoldOut ? 'Full' : `${event.capacity - event.booked} Spots Left`}
                                                        </span>
                                                    </div>
                                                    <h3 className="text-xl font-bold text-slate-800 mb-2">{event.title}</h3>
                                                    <p className="text-sm text-slate-500 line-clamp-2 mb-4 flex-1">{event.description}</p>
                                                    <div className="flex flex-col gap-2 mb-6">
                                                        <div className="flex items-center gap-2 text-xs font-semibold text-slate-400">
                                                            <span>📅 {event.date}</span>
                                                            <span>📍 {event.location}</span>
                                                        </div>
                                                        <div className="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden">
                                                            <div 
                                                                className={`h-full rounded-full transition-all duration-1000 ${isSoldOut ? 'bg-red-400' : 'bg-indigo-500'}`}
                                                                style={{ width: `${(event.booked / event.capacity) * 100}%` }}
                                                            ></div>
                                                        </div>
                                                    </div>
                                                    <button 
                                                        disabled={isSoldOut}
                                                        onClick={() => { setSelectedEvent(event); setView('registration'); }}
                                                        className={`w-full py-3 rounded-xl font-bold transition-all ${isSoldOut ? 'bg-slate-100 text-slate-400 cursor-not-allowed' : 'bg-slate-900 text-white hover:bg-indigo-600 shadow-md hover:shadow-indigo-100'}`}
                                                    >
                                                        {isSoldOut ? 'Sold Out' : 'Register Now'}
                                                    </button>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {/* REGISTRATION VIEW */}
                        {view === 'registration' && selectedEvent && (
                            <div className="animate-fade max-w-xl mx-auto bg-white p-10 rounded-[2.5rem] border border-slate-200 shadow-2xl">
                                <button onClick={() => setView('home')} className="mb-6 text-slate-400 hover:text-slate-600 text-sm font-bold flex items-center gap-1">← Go Back</button>
                                <h2 className="text-2xl font-black mb-1">Join "{selectedEvent.title}"</h2>
                                <p className="text-slate-500 mb-8 font-medium">Fill in your details to secure your spot.</p>
                                
                                <form onSubmit={(e) => {
                                    e.preventDefault();
                                    const data = new FormData(e.target);
                                    handleRegister(Object.fromEntries(data.entries()));
                                }} className="space-y-4">
                                    <div className="space-y-1">
                                        <label className="text-[10px] font-black text-slate-400 uppercase ml-1">Full Name</label>
                                        <input name="name" required placeholder="John Student" className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-indigo-50 focus:border-indigo-500 outline-none transition-all" />
                                    </div>
                                    <div className="space-y-1">
                                        <label className="text-[10px] font-black text-slate-400 uppercase ml-1">Student Email</label>
                                        <input name="email" required type="email" placeholder="john@campus.edu" className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-indigo-50 focus:border-indigo-500 outline-none transition-all" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="space-y-1">
                                            <label className="text-[10px] font-black text-slate-400 uppercase ml-1">Department</label>
                                            <select name="department" required className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none appearance-none">
                                                <option>Computer Science</option>
                                                <option>Mechanical</option>
                                                <option>Architecture</option>
                                                <option>Arts</option>
                                            </select>
                                        </div>
                                        <div className="space-y-1">
                                            <label className="text-[10px] font-black text-slate-400 uppercase ml-1">Roll Number</label>
                                            <input name="roll" required placeholder="CS-2024-01" className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none" />
                                        </div>
                                    </div>
                                    <button className="w-full bg-indigo-600 text-white py-5 rounded-2xl font-black text-lg shadow-xl shadow-indigo-100 hover:bg-indigo-700 hover:shadow-indigo-200 transition-all mt-4">
                                        Confirm Reservation
                                    </button>
                                </form>
                            </div>
                        )}
                    </main>

                    {/* Quick Stats Footer */}
                    <div className="fixed bottom-0 inset-x-0 bg-white border-t border-slate-100 p-4">
                        <div className="max-w-6xl mx-auto flex justify-center gap-8 text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em]">
                            <span className="flex items-center gap-1.5"><div className="w-2 h-2 rounded-full bg-indigo-500"></div> System Active</span>
                            <span className="flex items-center gap-1.5"><div className="w-2 h-2 rounded-full bg-emerald-500"></div> {events.length} Live Events</span>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
